name = "crypto-radar-monitor"
main = "workers/radar-monitor.js"
compatibility_date = "2026-09-20"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "crypto-radar-history"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
MONITOR_CRYPTO = "1"
MONITOR_STOCKS = "0"
PIONEX_SCAN_LIMIT = "20"
PUSH_SCORE_MIN = "78"
STOCK_WATCHLIST = "AAPL,MSFT,NVDA,AMZN,META,TSLA,AMD,AVGO,GOOGL,PLTR"
